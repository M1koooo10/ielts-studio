<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="Arial,sans-serif" fill="#192947"><title>From survey cards to a public report</title><rect width="800" height="450" fill="#fff"/><text x="32" y="44" font-size="25" font-weight="bold">From survey cards to a public report</text><rect x="50" y="91" width="316" height="66" fill="#e9f1fc" rx="10" stroke="#6084ba"/><text x="63" y="130" font-size="17" >1. Cards collected</text><text x="373" y="129" font-size="23" >→</text><rect x="410" y="91" width="316" height="66" fill="#e9f1fc" rx="10" stroke="#6084ba"/><text x="423" y="130" font-size="17" >2. Responses coded</text><rect x="50" y="199" width="316" height="66" fill="#e9f1fc" rx="10" stroke="#6084ba"/><text x="63" y="238" font-size="17" >3. Codes counted</text><text x="373" y="237" font-size="23" >→</text><rect x="410" y="199" width="316" height="66" fill="#e9f1fc" rx="10" stroke="#6084ba"/><text x="423" y="238" font-size="17" >4. Totals checked</text><rect x="50" y="307" width="316" height="66" fill="#e9f1fc" rx="10" stroke="#6084ba"/><text x="63" y="346" font-size="17" >5. Charts prepared</text><text x="373" y="345" font-size="23" >→</text><rect x="410" y="307" width="316" height="66" fill="#e9f1fc" rx="10" stroke="#6084ba"/><text x="423" y="346" font-size="17" >6. Report published</text></svg>
